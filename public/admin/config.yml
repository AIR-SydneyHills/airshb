backend:
  name: git-gateway
  branch: main

local_backend: true
# publish_mode: editorial_workflow

media_folder: 'src/assets/images'
public_folder: '../../assets/images'

site_url: https://airsydneyhills.netlify.app
logo_url: https://airsydneyhills.netlify.app/air.png

slug:
  encoding: 'ascii'
  clean_accents: true
  sanitize_replacement: '-'

collections:
  - name: 'files'
    label: 'Next Meeting'
    description: 'Edit details for next meeting'
    files:
      - name: 'next'
        label: 'Next Meeting'
        file: 'src/content/next/meeting.md'
        create: false
        fields:
          - { label: 'Title', name: 'title', widget: 'string', required: true }
          - { label: 'Date of Meeting', name: 'pubDate', widget: 'datetime', required: true }
          - { label: 'Description', name: 'description', widget: 'string', required: true }
          - { label: 'Body', name: 'body', widget: 'markdown' }
  - name: 'meeting'
    label: 'Past Meetings'
    label_singular: 'Meeting'
    folder: 'src/content/meeting'
    create: true
    preview_path_date_field: 'pubDate'
    preview_path: 'meeting/{{filename}}'
    slug: '{{year}}-{{month}}-{{day}}'
    fields:
      - { label: 'Draft', name: 'draft', widget: 'boolean', default: false }
      - { label: 'Title', name: 'title', widget: 'string', required: true }
      - { label: 'Date of Meeting', name: 'pubDate', widget: 'datetime', required: true }
      - { label: 'Description', name: 'description', widget: 'string', required: true }
      - label: 'Image'
        name: 'image'
        widget: 'image'
        required: false
        allow_empty: false
      - label: 'Additional Images'
        name: 'images'
        widget: 'list'
        hint: 'This will be displayed as a photo gallery at the end of the text.'
        required: false
        field: { label: 'Image', name: 'image', widget: 'image', allow_empty: false }
      - { label: 'Body', name: 'body', widget: 'markdown', required: false }
  - name: 'categories'
    label: 'Categories'
    label_singular: 'Category'
    folder: 'src/content/category'
    create: true
    fields:
      - { label: 'Draft', name: 'draft', widget: 'boolean', default: false }
      - { label: 'Title', name: 'title', widget: 'string', required: true }
      - { label: 'Description', name: 'description', widget: 'string', required: true }
      - { label: 'Image', name: 'image', widget: 'image', required: true, allow_empty: false }
      - { label: 'Body', name: 'body', widget: 'markdown', required: false }
  - name: 'authors'
    label: 'Authors'
    label_singular: 'Author'
    folder: 'src/content/author'
    create: true
    fields:
      - { label: 'Draft', name: 'draft', widget: 'boolean', default: false }
      - { label: 'Title', name: 'title', widget: 'string', required: true }
      - { label: 'Description', name: 'description', widget: 'string', required: true }
      - { label: 'Image', name: 'image', widget: 'image', required: true, allow_empty: false }
      - {
          label: 'Contact',
          name: 'contact',
          widget: 'string',
          required: true,
          hint: 'Phone or email'
        }
      - { label: 'Body', name: 'body', widget: 'markdown', required: false }
  - name: 'articles'
    label: 'Articles'
    label_singular: 'Article'
    folder: 'src/content/blog'
    slug: '{{year}}-{{month}}-{{day}}-{{title}}'
    create: true
    fields:
      - { label: 'Draft', name: 'draft', widget: 'boolean', default: false }
      - label: Author
        name: author
        widget: relation
        collection: authors
        value_field: '{{slug}}'
        search_fields: [title]
        display_fields: [title]
        multiple: false
        required: true
        filters:
          - { field: draft, values: [false] }
      - { label: 'Title', name: 'title', widget: 'string', required: true }
      - { label: 'Date of Article', name: 'pubDate', widget: 'datetime', required: true }
      - { label: 'Description', name: 'description', widget: 'string', required: true }
      - label: 'Image'
        name: 'image'
        widget: 'image'
        required: false
        allow_empty: false
      - label: 'Additional Images'
        name: 'images'
        widget: 'list'
        hint: 'This will be displayed as a photo gallery at the end of the text.'
        required: false
        field: { label: 'Image', name: 'image', widget: 'image', allow_empty: false }
      - label: Categories
        name: categories
        widget: relation
        collection: categories
        value_field: '{{slug}}'
        search_fields: [title]
        display_fields: [title]
        multiple: true
        min: 1
        filters:
          - { field: draft, values: [false] }
      - { label: 'Tags', name: 'tags', widget: 'list', required: false }
      - { label: 'Body', name: 'body', widget: 'markdown', required: false }
  - name: 'news'
    label: 'News'
    label_singular: 'News'
    folder: 'src/content/news'
    slug: '{{year}}-{{month}}-{{day}}-{{title}}'
    create: true
    fields:
      - { label: 'Draft', name: 'draft', widget: 'boolean', default: false }
      - label: Author
        name: author
        widget: relation
        collection: authors
        value_field: '{{slug}}'
        search_fields: [title]
        display_fields: [title]
        multiple: false
        required: true
        filters:
          - { field: draft, values: [false] }
      - { label: 'Title', name: 'title', widget: 'string', required: true }
      - { label: 'Date of Article', name: 'pubDate', widget: 'datetime', required: true }
      - { label: 'Description', name: 'description', widget: 'string', required: true }
      - label: 'Image'
        name: 'image'
        widget: 'image'
        required: false
        allow_empty: false
      - label: 'Additional Images'
        name: 'images'
        widget: 'list'
        hint: 'This will be displayed as a photo gallery at the end of the text.'
        required: false
        field: { label: 'Image', name: 'image', widget: 'image', allow_empty: false }
      - label: Categories
        name: categories
        widget: relation
        collection: categories
        value_field: '{{slug}}'
        search_fields: [title]
        display_fields: [title]
        multiple: true
        min: 1
        filters:
          - { field: draft, values: [false] }
      - { label: 'Tags', name: 'tags', widget: 'list', required: false }
      - { label: 'Body', name: 'body', widget: 'markdown', required: false }
  - name: 'pages'
    label: 'Pages'
    label_singular: 'Page'
    folder: 'src/content/page'
    create: true
    fields:
      - { label: 'Draft', name: 'draft', widget: 'boolean', default: false }
      - label: Author
        name: author
        widget: relation
        collection: authors
        value_field: '{{slug}}'
        search_fields: [title]
        display_fields: [title]
        multiple: false
        required: false
        filters:
          - { field: draft, values: [false] }
      - { label: 'Title', name: 'title', widget: 'string', required: true }
      - { label: 'Date', name: 'pubDate', widget: 'datetime', required: false }
      - { label: 'Description', name: 'description', widget: 'string', required: false }
      - { label: 'Image', name: 'image', widget: 'image', required: false, allow_empty: false }
      - label: 'Additional Images'
        name: 'images'
        widget: 'list'
        hint: 'This will be displayed as a photo gallery at the end of the text.'
        required: false
        field: { label: 'Image', name: 'image', widget: 'image', allow_empty: false }
      - { label: 'Tags', name: 'tags', widget: 'list', required: false }
      - { label: 'Body', name: 'body', widget: 'markdown', required: false }
